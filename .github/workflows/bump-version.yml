name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json version
        id: bump
        run: |
          pnpm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # Writes expo.version plus the two native build numbers
      # (expo.android.versionCode / expo.ios.buildNumber). The native folders are
      # gitignored and regenerated by `expo prebuild`, so app.json is the ONLY
      # place these can be set — see scripts/sync-version.mjs for why the build
      # number increments on every run regardless of the semver bump.
      - name: Sync version and build number to app.json
        id: sync
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          node scripts/sync-version.mjs "${VERSION#v}"

      - name: Commit, tag and push
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BUILD="${{ steps.sync.outputs.build }}"
          git add package.json app.json
          git commit -m "chore: bump version to ${VERSION} (build ${BUILD})"
          git tag "${VERSION}"
          git push origin HEAD --tags
