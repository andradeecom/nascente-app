name: Submit iOS for review

# Submits an EXISTING TestFlight build to App Store review — no rebuild, no
# version bump. Run it with the release tag (e.g. v1.1.0) that produced the
# TestFlight build you tested: the lane reads version + build number from that
# tag's app.json, so exactly the tested binary is submitted.
# Step-by-step: .docs/release-runbook.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag whose TestFlight build to submit (e.g. v1.1.0)'
        required: true
        type: string

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  submit:
    # deliver only talks to the App Store Connect API — no Xcode needed, but
    # fastlane's iOS actions are only supported on macOS.
    runs-on: macos-26
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Submit to App Store review
        run: bundle exec fastlane ios release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
